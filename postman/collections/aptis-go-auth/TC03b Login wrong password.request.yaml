$kind: http-request
name: TC03b Login wrong password (negative)
method: POST
url: '{{baseUrl}}/api/auth/login'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{qaEmail}}",
      "password": "DefinitelyWrong1!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();

      pm.test('TC03b wrong password is rejected with 401', () => {
        pm.response.to.have.status(401);
        pm.expect(body.error).to.eql('Invalid email or password');
      });

      pm.test('TC03b does not return a token', () => {
        pm.expect(body).to.not.have.property('token');
      });
